[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fridgestare-backend"
version = "0.1.0"
description = "Backend API for Fridgestare"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.1",
  "apscheduler>=3.11.3",
  "argon2-cffi>=25.1.0",
  "email-validator>=2.3.0",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pydantic-settings>=2.15.0",
  "pyjwt>=2.13.0",
  "pymysql>=1.2.0",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.0.52",
  "typer>=0.27.1",
  "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
  "pylint>=4.0.7",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4,<0.17",
]

[project.scripts]
fridgestare = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom relies on calling Depends() (and friends)
# in argument defaults; it's not a mutable-default footgun.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.pylint.main]
ignore = ["alembic"]

[tool.pylint.messages_control]
disable = [
  "missing-docstring",
  "too-few-public-methods",
  "duplicate-code",
  "too-many-arguments",
  "too-many-positional-arguments",
]
