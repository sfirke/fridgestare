[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fridgestare-backend"
version = "0.1.0"
description = "Backend API for Fridgestare"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.2",
  "apscheduler>=3.11.0",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "passlib>=1.7.4",
  "pydantic-settings>=2.9.1",
  "pyjwt>=2.10.1",
  "pymysql>=1.1.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.40",
  "typer>=0.15.3",
  "uvicorn[standard]>=0.34.2",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.3.7",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.8",
]

[project.scripts]
fridgestare = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.pylint.main]
ignore = ["alembic"]

[tool.pylint.messages_control]
disable = [
  "missing-docstring",
  "too-few-public-methods",
  "duplicate-code",
  "too-many-arguments",
]
